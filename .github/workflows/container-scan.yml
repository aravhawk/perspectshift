name: Container Scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 7 * * 3"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build runtime image
        run: docker build -f deploy/containers/Dockerfile.runtime -t perceptshift-runtime:ci .
      - name: Build API image
        run: docker build -f deploy/containers/Dockerfile.api -t perceptshift-api:ci .
      - name: Build console image
        run: docker build -f deploy/containers/Dockerfile.console -t perceptshift-console:ci .
      - name: Scan runtime image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: perceptshift-runtime:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: perceptshift-api:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: Scan console image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: perceptshift-console:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: Verify non-root user
        run: |
          set -euo pipefail
          for img in perceptshift-runtime:ci perceptshift-api:ci perceptshift-console:ci; do
            user=$(docker image inspect "$img" --format '{{.Config.User}}')
            echo "$img user=$user"
            test -n "$user" && test "$user" != "root" && test "$user" != "0"
          done
      - name: SBOM
        run: ./scripts/generate-sbom.sh
