name: Container Scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 7 * * 3"

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        run: docker build -f deploy/containers/Dockerfile.runtime -t perceptshift-runtime:ci .
      - name: Build API image
        run: docker build -f deploy/containers/Dockerfile.api -t perceptshift-api:ci .
      - name: Build console image
        run: docker build -f deploy/containers/Dockerfile.console -t perceptshift-console:ci .
      - name: Scan images with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: perceptshift-runtime:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: Verify non-root user
        run: |
          for img in perceptshift-runtime:ci perceptshift-api:ci perceptshift-console:ci; do
            user=$(docker image inspect "$img" --format '{{.Config.User}}')
            echo "$img user=$user"
            test -n "$user" && test "$user" != "root" && test "$user" != "0"
          done
      - name: SBOM
        run: ./scripts/generate-sbom.sh
