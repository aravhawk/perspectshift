name: CI Linux x64

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-x64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify repository policy
        run: ./scripts/verify-repository.sh

  cpp-gcc:
    needs: verify-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bootstrap
        run: ./scripts/bootstrap-ubuntu.sh --noninteractive
      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnxruntime
        with:
          arch: x64
      - name: Configure and build (GCC)
        run: |
          set -euo pipefail
          cmake --preset release-x64
          cmake --build --preset release-x64 -j "$(nproc)"
      - name: C++ tests
        run: |
          set -euo pipefail
          TEST_DIR=build/release-x64
          COUNT="$(ctest --test-dir "$TEST_DIR" -N | awk '/Total Tests:/ {print $3}')"
          if [[ -z "$COUNT" || "$COUNT" -eq 0 ]]; then
            echo "ERROR: zero tests discovered in $TEST_DIR" >&2
            exit 1
          fi
          ctest --test-dir "$TEST_DIR" --output-on-failure

  cpp-clang:
    needs: verify-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap
        run: ./scripts/bootstrap-ubuntu.sh --noninteractive
      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnxruntime
        with:
          arch: x64
      - name: Configure and build (Clang)
        run: |
          set -euo pipefail
          cmake -S . -B build-clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DPERCEPTSHIFT_WITH_ONNXRUNTIME=ON \
            -DPERCEPTSHIFT_ORT_ROOT="${PERCEPTSHIFT_ORT_ROOT}"
          cmake --build build-clang -j "$(nproc)"
      - name: C++ tests
        run: |
          set -euo pipefail
          TEST_DIR=build-clang
          COUNT="$(ctest --test-dir "$TEST_DIR" -N | awk '/Total Tests:/ {print $3}')"
          if [[ -z "$COUNT" || "$COUNT" -eq 0 ]]; then
            echo "ERROR: zero tests discovered in $TEST_DIR" >&2
            exit 1
          fi
          ctest --test-dir "$TEST_DIR" --output-on-failure

  python:
    needs: verify-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bootstrap
        run: ./scripts/bootstrap-ubuntu.sh --noninteractive
      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnxruntime
        with:
          arch: x64
      - name: Build native workers
        run: |
          set -euo pipefail
          cmake --preset release-x64
          cmake --build --preset release-x64 -j "$(nproc)"
      - name: Sync Python workspace
        run: uv sync --locked --all-packages --all-extras --group dev
      - name: Ruff
        run: uv run ruff check python
      - name: Pyright
        run: uv run pyright
      - name: Prove native workers
        env:
          PERCEPTSHIFT_ORT_ROOT: ${{ github.workspace }}/.cache/onnxruntime-linux-x64-1.28.0
        run: |
          set -euo pipefail
          BIN_DIR="${GITHUB_WORKSPACE}/build/release-x64/cpp"
          ls -la "${BIN_DIR}"
          for bin in perceptshift-bench-worker perceptshift-preprocess-worker perceptshift-inspect-worker; do
            test -x "${BIN_DIR}/${bin}"
            if env -u LD_LIBRARY_PATH ldd "${BIN_DIR}/${bin}" | grep -q "not found"; then
              echo "::error::${bin} has unresolved shared libraries without LD_LIBRARY_PATH"
              env -u LD_LIBRARY_PATH ldd "${BIN_DIR}/${bin}"
              exit 1
            fi
            # Product binaries must start from the build tree via BUILD_RPATH.
            env -u LD_LIBRARY_PATH "${BIN_DIR}/${bin}" --version
          done
      - name: Pytest
        env:
          PERCEPTSHIFT_ROOT: ${{ github.workspace }}
          PERCEPTSHIFT_ORT_ROOT: ${{ github.workspace }}/.cache/onnxruntime-linux-x64-1.28.0
          LD_LIBRARY_PATH: ${{ github.workspace }}/.cache/onnxruntime-linux-x64-1.28.0/lib
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/build/release-x64/cpp:${PATH}"
          set +e
          uv run pytest --tb=short > pytest-out.txt 2>&1
          rc=$?
          set -e
          cat pytest-out.txt
          if [[ "$rc" -ne 0 ]]; then
            grep -E '^E |^FAILED |PerceptShiftError|Error:' pytest-out.txt | tail -n 40 | while IFS= read -r ln; do
              [[ -z "$ln" ]] && continue
              echo "::error::pytest: ${ln:0:240}"
            done
          fi
          exit "$rc"

  web:
    needs: verify-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Install and test
        working-directory: web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

  ros:
    needs: verify-policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap with ROS
        run: ./scripts/bootstrap-ubuntu.sh --noninteractive --with-ros
      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnxruntime
        with:
          arch: x64
      - name: Build ROS workspace
        run: |
          set -euo pipefail
          if [[ ! -f /opt/ros/jazzy/setup.bash ]]; then
            echo "ROS Jazzy setup.bash missing after bootstrap; failing closed" >&2
            exit 1
          fi
          export PERCEPTSHIFT_PREFIX="${HOME}/perceptshift-prefix"
          export PERCEPTSHIFT_CORE_BUILD="${GITHUB_WORKSPACE}/build/ros-core"
          ./scripts/build-ros-with-core.sh
          set +u
          # shellcheck disable=SC1091
          source /opt/ros/jazzy/setup.bash
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/ros2_ws/install/setup.bash"
          set -u
          if ! command -v ros2 >/dev/null; then
            echo "ros2 still unavailable after sourcing Jazzy" >&2
            exit 1
          fi
          export CMAKE_PREFIX_PATH="${PERCEPTSHIFT_PREFIX}:${CMAKE_PREFIX_PATH:-}"
          export LD_LIBRARY_PATH="${PERCEPTSHIFT_PREFIX}/lib:${PERCEPTSHIFT_ORT_ROOT}/lib:${LD_LIBRARY_PATH:-}"
          cd ros2_ws
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

  e2e-docs:
    needs: [cpp-gcc, python, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.16"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bootstrap
        run: ./scripts/bootstrap-ubuntu.sh --noninteractive
      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnxruntime
        with:
          arch: x64
      - name: Build native runtime
        run: |
          set -euo pipefail
          cmake --preset release-x64
          cmake --build --preset release-x64 -j "$(nproc)"
      - name: Python workspace
        run: uv sync --locked --all-packages --all-extras --group dev
      - name: E2E and docs check
        env:
          PERCEPTSHIFT_ROOT: ${{ github.workspace }}
          PERCEPTSHIFT_ORT_ROOT: ${{ github.workspace }}/.cache/onnxruntime-linux-x64-1.28.0
          LD_LIBRARY_PATH: ${{ github.workspace }}/.cache/onnxruntime-linux-x64-1.28.0/lib
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/build/release-x64/cpp:${PATH}"
          set +e
          ./scripts/run-e2e.sh > e2e-out.txt 2>&1
          rc=$?
          set -e
          cat e2e-out.txt
          if [[ "$rc" -ne 0 ]]; then
            grep -E 'control_hold_reason|AssertionError|Error:|native_e2e|zeros smoke|ModelTensorMismatch' e2e-out.txt | tail -n 30 | while IFS= read -r ln; do
              [[ -z "$ln" ]] && continue
              echo "::error::e2e: ${ln:0:240}"
            done
            tail -n 20 e2e-out.txt | while IFS= read -r ln; do
              [[ -z "$ln" ]] && continue
              echo "::error::e2e: ${ln:0:240}"
            done
            exit "$rc"
          fi
          make docs-check
      - name: Summary
        run: |
          mkdir -p build/verification
          echo '{"workflow":"ci-linux-x64","status":"completed"}' > build/verification/summary.json
