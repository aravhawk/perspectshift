name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 5 * * 2"

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Bootstrap C++ dependencies
        if: matrix.build-mode == 'manual'
        run: ./scripts/bootstrap-ubuntu.sh --noninteractive
      - name: Setup ONNX Runtime
        if: matrix.build-mode == 'manual'
        uses: ./.github/actions/setup-onnxruntime
        with:
          arch: x64
      - name: Build C++ with CodeQL tracing
        if: matrix.build-mode == 'manual'
        run: |
          set -euo pipefail
          cmake --preset release-x64
          cmake --build --preset release-x64 -j "$(nproc)"
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
