[project]
name = "perceptshift-forge"
version = "0.1.0"
description = "Offline orchestration, quantization, evaluation, and certification for PerceptShift"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "PerceptShift Contributors" }]
dependencies = [
  "perceptshift-common",
  "onnxruntime==1.28.0",
  "onnx>=1.17.0",
  "numpy>=2.1.0",
  "pillow>=11.0.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.2",
  "jsonschema>=4.23.0",
  "httpx>=0.28.0",
  "rich>=13.9.0",
  "cryptography>=43.0.0",
]

[project.optional-dependencies]
coco = ["pycocotools>=2.0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



[tool.hatch.build.targets.wheel]

