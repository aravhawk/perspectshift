[project]
name = "perceptshift-cli"
version = "0.1.0"
description = "Operator CLI for PerceptShift"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "PerceptShift Contributors" }]
dependencies = [
  "perceptshift-common",
  "perceptshift-forge",
  "typer>=0.15.0",
  "rich>=13.9.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.2",
]

[project.scripts]
perceptshift = "perceptshift_cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



[tool.hatch.build.targets.wheel]

