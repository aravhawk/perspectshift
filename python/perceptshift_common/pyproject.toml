[project]
name = "perceptshift-common"
version = "0.1.0"
description = "Shared contracts, errors, hashing, and paths for PerceptShift"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "PerceptShift Contributors" }]
dependencies = [
  "jsonschema>=4.23.0",
  "referencing>=0.35.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.2",
  "numpy>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/perceptshift/perceptshift"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



[tool.hatch.build.targets.wheel]

